name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rules engine is the part that has to be correct, so a failing
      # test blocks both deploys rather than shipping a broken board.
      - name: Engine, network and dictionary tests
        run: npm test

      # The server side, where a mistake is a hole rather than a bug: forged
      # passes, sign-in state, save permissions, the panel's allowlist.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Account and panel auth tests
        run: |
          python ops/test_accounts.py
          python ops/test_auth.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The TURN relay, if one is set up. Absent secrets build a STUN-only
      # client. These end up readable in the bundle - see docs/turn.md - but
      # keeping them in repo secrets keeps them out of git history.
      - name: Build for GitHub Pages (served from /monopoly/)
        env:
          BASE_PATH: /monopoly/
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          # Plus checkout. Public values, so repository variables, not secrets.
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          VITE_PADDLE_PRICE_MONTHLY: ${{ vars.PADDLE_PRICE_MONTHLY }}
          VITE_PADDLE_PRICE_YEARLY: ${{ vars.PADDLE_PRICE_YEARLY }}
        run: |
          npm run build
          # SPA fallback: the app uses hash routing, but this keeps a stray
          # deep link from returning GitHub's 404 page.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          mv dist dist-pages

      - name: Build for aytingchi.uz (served from /)
        env:
          BASE_PATH: /
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          # Plus checkout. Public values, so repository variables, not secrets.
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          VITE_PADDLE_PRICE_MONTHLY: ${{ vars.PADDLE_PRICE_MONTHLY }}
          VITE_PADDLE_PRICE_YEARLY: ${{ vars.PADDLE_PRICE_YEARLY }}
        run: |
          npm run build
          mv dist dist-aytingchi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

      - uses: actions/upload-artifact@v7
        with:
          name: aytingchi
          path: dist-aytingchi
          retention-days: 7

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The same build, at the site root, onto the droplet. The key can do one
  # thing: hand ops/aytingchi-deploy.sh a tarball on stdin. See that script.
  deploy-aytingchi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: aytingchi
      url: https://aytingchi.uz/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aytingchi
          path: site

      - name: Upload to the droplet
        env:
          DEPLOY_KEY: ${{ secrets.AYTINGCHI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AYTINGCHI_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C site . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes root@159.223.6.35 deploy

      - name: Check the site serves this build
        run: |
          want=$(grep -o 'assets/index-[^"]*\.js' site/index.html)
          for i in 1 2 3 4 5; do
            if curl -fsS https://aytingchi.uz/ | grep -q "$want"; then echo "live: $want"; exit 0; fi
            sleep 3
          done
          echo "aytingchi.uz is not serving $want" >&2
          exit 1
