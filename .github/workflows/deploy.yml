name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The rules engine is the part that has to be correct, so a failing
      # test blocks the deploy rather than shipping a broken board.
      - name: Run the engine test suite
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Pages serves this from /<repo>/, which vite.config.ts defaults to.
          BASE_PATH: /monopoly/
          # The TURN relay, if one is set up. Absent secrets build a
          # STUN-only client, which is exactly what shipped before.
          # These end up readable in the bundle - see docs/turn.md - but
          # keeping them in repo secrets keeps them out of git history.
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}

      # SPA fallback: the app uses hash routing, but this keeps a stray
      # deep link from returning GitHub's 404 page.
      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
