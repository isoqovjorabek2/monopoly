<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05100c" />

    <!--
      Installable app shell. The manifest link and the icon hrefs are relative
      on purpose: the same build is served from /monopoly/ on GitHub Pages and
      from / on partyhall.io, and relative URLs resolve under either base.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Party Hall" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <title>Party Hall - board games with friends, anywhere</title>
    <meta name="description" content="Board games in the browser, with friends anywhere: Bazaar Barons, a Silk Road trading game, and Nest Egg, a race out of the grind. Share a link, pick your rules, no signup." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Party Hall" />
    <meta property="og:description" content="Share a link and play Bazaar Barons or Nest Egg with friends anywhere. No signup." />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Scrapers do not resolve relative og:image, so this has to be absolute.
      Point it at wherever the build is served from; the path under the
      origin is always /<base>art/og.jpg.
    -->
    <meta property="og:image" content="https://partyhall.io/art/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A green felt table lit by a brass lamp, with a gold deco medallion, playing pieces and dice." />
    <meta name="twitter:image" content="https://partyhall.io/art/og.jpg" />

    <!--
      Google Search ignores inline data-URI icons: it crawls the favicon as a
      file, at 48x48 or a multiple. The ICO carries 16/32/48; the SVG stays as
      the crisp variant for browsers that prefer it.
    -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2016'/%3E%3Crect x='12' y='20' width='40' height='9' rx='2' fill='%23dcae52'/%3E%3Crect x='18' y='29' width='28' height='18' rx='2' fill='%23dcae52'/%3E%3Crect x='10' y='47' width='44' height='5' rx='2' fill='%23c8912f'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@300;400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Where the ad network draws a between-games video (net/ads.ts). -->
    <div id="aip-preroll"></div>
    <noscript>Party Hall needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
